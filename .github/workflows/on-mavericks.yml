name: on-mavericks

# spec: mavergreen-conventions SKILL.md "Acceptance on real 10.9" -- the 10.9 acceptance job: Linux makes ext4, btrfs, xfs,
#       NTFS, exFAT and APFS images (tests/lib/probe-images.sh); a fresh Mac OS X 10.9.5 guest (Mavergreen/mavericks-vm), logged in
#       to its console (the session DiskArbitration mounts for), installs the pinned Mavergreen macFUSE (and the Recaulk that release was
#       tested with) and the run's pkg, and runs tests/smoke-mavericks.sh, which mounts, writes, unmounts and reads back each
#       image through `linuxfs mount`, checks DiskArbitration mounts attached disks (raw and GPT-wrapped) through the six
#       bundles, the password dialog and keychain for encrypted APFS, and the before-login mount (root mounts, lklfuse as _linuxfs serves); then Linux checks every image
#       the guest wrote with its own fsck (tests/lib/check-fs.sh). Any panic, hang, skip (77) or failed fsck fails.
#       release.yml calls it, and its publish job needs it.
on:
  workflow_call:
    inputs:
      version:
        description: The run's version, <UPSTREAM_VERSION>-mavericks.N
        type: string
        required: true
      artifact:
        description: The run's dist artifact, holding linuxfs-<version>.pkg
        type: string
        required: true
    secrets:
      MAVERICKS_VM_KEY:
        required: true

permissions:
  contents: read

jobs:
  images:
    name: Linux makes the test images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: ext4, btrfs, xfs, f2fs, NTFS, exFAT and APFS images, labelled, and the Linux-made Unicode names, in the build container
        run: |
          set -eu
          d="$RUNNER_TEMP/images"
          mkdir -p "$d"
          LINUX_HOST_SHARE="$HOME" sh build/linux-host.sh sh tests/lib/probe-images.sh "$d"
          LINUX_HOST_SHARE="$HOME" sh build/linux-host.sh sh tests/lib/label-images.sh "$d"
          LINUX_HOST_SHARE="$HOME" sh build/linux-host.sh sh tests/lib/unicode-images.sh "$d"
          mkdir -p "$RUNNER_TEMP/up"
          for fs in ext4 btrfs xfs f2fs ntfs exfat apfs; do gzip -c "$d/$fs.img" > "$RUNNER_TEMP/up/$fs.img.gz"; done
          gzip -c "$d/ext4-names.img" > "$RUNNER_TEMP/up/ext4-names.img.gz"
          for l in slash ctl; do [ ! -f "$d/ext4-$l.img" ] || gzip -c "$d/ext4-$l.img" > "$RUNNER_TEMP/up/ext4-$l.img.gz"; done
      # spec: tests/lib/gpt-wrap.py -- the same images in a GPT wrapper with each filesystem's own partition type (Linux data, basic data for NTFS, APFS), plus ext4 in the basic-data type,
      #       as an external disk formatted by macOS is laid out,
      #       and the encrypted APFS fixture (password linuxfs-test) in one too: its partition UUID is the keychain's account
      - name: GPT-wrapped copies and the encrypted APFS fixture
        run: |
          set -eu
          d="$RUNNER_TEMP/images"
          linux=0FC63DAF-8483-4772-8E79-3D69D8477DE4 basic=EBD0A0A2-B9E5-4433-87C0-68B6B72699C7 apfs=7C3457EF-0000-11AA-AA11-00306543ECAC
          for c in ext4:$linux btrfs:$linux xfs:$linux f2fs:$linux ntfs:$basic apfs:$apfs; do
            fs=${c%%:*}
            python3 -I tests/lib/gpt-wrap.py "$d/$fs.img" "$d/gpt-$fs.img" "${c#*:}"
            gzip -c "$d/gpt-$fs.img" > "$RUNNER_TEMP/up/gpt-$fs.img.gz"
          done
          python3 -I tests/lib/gpt-wrap.py "$d/ext4.img" "$d/gpt-ext4-basic.img" "$basic"
          gzip -c "$d/gpt-ext4-basic.img" > "$RUNNER_TEMP/up/gpt-ext4-basic.img.gz"
          gzip -dc tests/fixtures/apfs/enc.img.gz > "$d/enc.img"
          python3 -I tests/lib/gpt-wrap.py "$d/enc.img" "$d/gpt-enc.img"
          gzip -c "$d/gpt-enc.img" > "$RUNNER_TEMP/up/gpt-enc.img.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: linuxfs-images-before
          if-no-files-found: error
          path: ${{ runner.temp }}/up/*.img.gz

  guest:
    name: Mount, write, read back and automount on Mac OS X 10.9 (mavericks-vm)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      # platform: review M11: GitHub withholds organization secrets from a fork's pull request, so its run cannot reach the VM.
      #           That cannot verify the change, which is a failure (never a pass), but it fails first and says why.
      - name: The 10.9 VM key
        env:
          HAS_KEY: ${{ secrets.MAVERICKS_VM_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::No MAVERICKS_VM_KEY: GitHub gives a fork's pull request no organization secrets, so this run cannot reach the 10.9 VM and cannot verify the change. A maintainer pushes the branch to this repository to run it here."
            exit 1
          fi
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: "${{ inputs.artifact }}", path: dist }
      - uses: actions/download-artifact@v8
        with: { name: linuxfs-images-before, path: images }
      # spec: components/macfuse/version -- the macfuse lklfuse was built against; Recaulk is the one that macfuse release pins at its own tag, so
      #       the guest runs macfuse exactly as macfuse's own 10.9 job did
      - name: The pinned Mavergreen macFUSE and its Recaulk
        run: |
          set -eu
          mf="$(tr -d '[:space:]' < components/macfuse/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" macfuse "$mf" "macfuse-$mf.pkg" deps
          . "$SHIPYARD_SCRIPTS/mavericks_fetch.sh"
          shipyard_curl "https://raw.githubusercontent.com/Mavergreen/macfuse/$mf/components/recaulk/version" "$RUNNER_TEMP/recaulk-version"
          rc="$(tr -d '[:space:]' < "$RUNNER_TEMP/recaulk-version")"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" recaulk "$rc" "recaulk-$rc.pkg" deps
      - uses: Mavergreen/mavericks-vm@v1
        env:
          LINUXFS_VERSION: ${{ inputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          aqua-session: 'true'
          copyback: 'true'
          debug-on-error: true
          envs: 'LINUXFS_VERSION'
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            sudo installer -pkg deps/recaulk-*.pkg -target /
            sudo installer -pkg deps/macfuse-*.pkg -target /
            sudo installer -pkg "dist/linuxfs-$LINUXFS_VERSION.pkg" -target /
            # spec: tests/smoke-mavericks.sh header -- over ssh, as the guest's user: the smoke goes through guest-macosx-aqua for what needs the console session, and
            #       ends with the before-login checks (it logs the console user out and does not bring the session back)
            status=0; sh tests/smoke-mavericks.sh "$LINUXFS_VERSION" images images-after || status=$?
            [ "$status" -eq 0 ] || { echo "tests/smoke-mavericks.sh exited $status (77 is a skip, a failure here)"; exit 1; }
      # spec: Mavergreen/mavericks-vm README -- copyback: true copies the workspace back after run, failure included, so the guest's
      #       screenshots and system.log arrive in images-after
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linuxfs-guest-out
          if-no-files-found: warn
          path: |
            images-after/*.png
            images-after/*.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linuxfs-images-after
          if-no-files-found: warn
          path: images-after/*.img.gz

  fsck:
    name: Linux's own fsck on every image the guest wrote
    needs: [guest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: linuxfs-images-after, path: "${{ runner.temp }}/after" }
      # spec: tests/lib/parity.sh census_unicode -- the census records, never gates: the names Apple's msdosfs wrote to the
      #       FAT32 control (ctl-fat32.img, in its uni-fat32 directory), as Linux reads them, one hex line per name
      - name: The FAT32 control's names as Linux reads them (census, recorded only)
        run: |
          set +e
          d="$RUNNER_TEMP/after" t="$RUNNER_TEMP/check-names.out"
          if [ ! -f "$d/ctl-fat32.img.gz" ]; then echo "# the guest returned no ctl-fat32.img.gz (the census did not run)"; exit 0; fi
          gzip -dc "$d/ctl-fat32.img.gz" > "$RUNNER_TEMP/ctl-fat32.img" 2> "$t"; rc=$?
          if [ "$rc" -ne 0 ]; then echo "# gzip -dc ctl-fat32.img.gz failed (exit $rc):"; sed 's/^/#   /' "$t"; exit 0; fi
          python3 -I tests/lib/check-names.py fat "$RUNNER_TEMP/ctl-fat32.img" uni-fat32 > "$t" 2>&1; rc=$?
          sed 's/^/# ctl-fat32 uni-fat32 name: /' "$t"
          [ "$rc" -eq 0 ] || echo "# check-names.py fat failed on ctl-fat32.img (exit $rc; its output is above)"
          exit 0
      - name: e2fsck -fn, btrfs check, xfs_repair -n, ntfsfix -n, fsck.exfat -n and fsck.f2fs --dry-run, in the build container
        run: |
          set -eu
          d="$RUNNER_TEMP/after"
          for z in "$d"/*.img.gz; do gunzip "$z"; done
          LINUX_HOST_SHARE="$HOME" sh build/linux-host.sh sh -c '
            rc=0
            for c in ext4:ext4 btrfs:btrfs xfs:xfs ntfs:ntfs exfat:exfat f2fs:f2fs ext4:da-ext4 btrfs:da-btrfs xfs:da-xfs ntfs:da-ntfs f2fs:da-f2fs ext4:da-ext4-noauto ntfs:da-ntfs-noauto ext4:da-ext4-ro ext4:login-ext4; do
              fs=${c%%:*} img=$1/${c#*:}.img
              if [ ! -f "$img" ]; then echo "not ok - $img: the guest returned no such image"; rc=1
              elif sh tests/lib/check-fs.sh "$fs" "$img"; then echo "ok - $img is clean ($fs)"
              else echo "not ok - $img is not clean ($fs)"; rc=1; fi
            done
            exit $rc' _ "$d"
