name: release

# spec: mavergreen-conventions SKILL.md "Release workflow" -- auto-cut on main: a push to main whose UPSTREAM_VERSION has no
#       release yet cuts <upstream>-mavericks.1; a dispatch with local_release=true cuts .N+1 (repackage-on-ingredient-bump.yml);
#       reconcile=true (reconcile.yml) publishes only while no release carries this declared state. PRs and other branches build
#       and gate, never publish.
# spec: .github/workflows/pins-bot.yml -- the pins bot pushes to Renovate's branch with a GitHub App token, which starts the
#       pull_request run below (that run's required check is the PR's); renovate/** is left out of the push trigger so that
#       push does not build the same head twice.
# spec: INGREDIENTS.md "Conformance deviations" native-build:kernel -- every build step runs on Linux: the kernel needs
#       kbuild, the Mach-O tools cross-compile with clang22 and the pinned 10.9 SDK, and the pkg is built by stevedore, so no
#       job here takes a macOS runner. The kernel and tools build inside build/linux-host/Dockerfile's image, the one
#       build/linux-host.sh gives a developer, so CI and a 10.9 box with Container Tools build in the same digest-pinned
#       Debian; the run's 10.9 acceptance is on-mavericks.yml, in the mavericks-vm guest.
on:
  push:
    branches-ignore: ['renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop: publish only if no release carries this declared state"
        type: boolean
        default: false

permissions:
  contents: read

# spec: mavergreen-conventions SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # spec: build/linux-host.sh -- the container sees the runner's home at the same path: the workspace, the shipyard
      #       action's checkout (SHIPYARD_SCRIPTS) and RUNNER_TEMP are all under it
      - name: Build out of tree, under the runner's home that the build container shares
        run: |
          set -eu
          b="$RUNNER_TEMP/mm-build"
          {
            echo "MAVERICKS_BUILD_ROOT=$b"
            echo "DIST=$b/dist"
            echo "LINUX_HOST_SHARE=$HOME"
            echo "MAVERICKS_SOURCE_CACHE=$HOME/Library/Caches/mavericks-sources"
          } >> "$GITHUB_ENV"

      # spec: mavergreen-conventions SKILL.md "Versioning" -- a derived upstream is derived before anything reads the
      #       version; a committed UPSTREAM_VERSION that the pin no longer gives fails here, naming the fix
      - name: UPSTREAM_VERSION is what the LKL pin derives
        run: |
          set -eu
          sh build/derive-upstream-version.sh
          git diff --quiet -- UPSTREAM_VERSION || {
            echo "::error::UPSTREAM_VERSION is stale for components/lkl/version; run sh build/derive-upstream-version.sh and commit it (the pins bot does this on a Renovate branch)"
            git diff -- UPSTREAM_VERSION; exit 1; }

      - name: Version + publish decision
        id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          effective_local_release="$LOCAL_RELEASE"
          if [ "$RECONCILE" = true ]; then effective_local_release=true; fi
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          # spec: mavergreen-conventions SKILL.md "Release workflow" -- only a push to main or a dispatch on main publishes (review M10: never a branch)
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main) : ;;
            *) rel=no ;;
          esac
          # spec: mavergreen-conventions SKILL.md "A release is a declared state" -- a reconcile dispatch publishes only while no
          #       release carries this state
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            echo "release-needed: $answer"
            [ "$answer" = PUBLISH ] || rel=no
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: LKL's kernel, host library and lklfuse, and linuxfs's own tools, for x86_64 10.9 (in the build container)
        run: sh build/linux-host.sh sh build/build-lkl-darwin.sh "$MAVERICKS_BUILD_ROOT/built"

      - name: clang22's Mach-O readers, for the steps that read Mach-O
        run: |
          set -eu
          CL="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" components/clang22)"
          {
            echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"
            echo "STRINGS=$CL/bin/llvm-strings"
          } >> "$GITHUB_ENV"

      # spec: mavergreen-conventions SKILL.md "Build equivalence" -- the compat guard over every Mach-O the pkg ships, since
      #       no 10.9 runner builds them; the strict Objective-C analyzer is not asked for: these are C programs with no
      #       Objective-C sends to measure (the agent calls DiskArbitration and CoreFoundation through their C APIs)
      - name: Compat guard on every shipped binary
        run: |
          set -eu
          b="$MAVERICKS_BUILD_ROOT/built"
          sh "$SHIPYARD_SCRIPTS/assert_binary_compatible.sh" \
            "$b/lklfuse" "$b/linuxfs-probe" "$b/linuxfs-open" "$b/linuxfs-fs" "$b/linuxfs-helper" "$b/linuxfs-agent"

      - name: Stage the product, build the updater, package
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          b="$MAVERICKS_BUILD_ROOT"
          sh build/stage.sh --built "$b/built" --out "$b/stage" --version "$VER"
          mkdir -p "$b/updater"
          sh build/build-updater.sh "$VER" "$b/updater/linuxfs-updater.app"
          sh build/package.sh --stage "$b/stage" --updater-app "$b/updater/linuxfs-updater.app" --version "$VER" --out "$DIST"

      # spec: build/linux-host/Dockerfile -- the suites that need Linux's mkfs and fsck tools, kbuild and FUSE run in the
      #       build container, with /dev/fuse (gate0b-linux.sh mounts through lklfuse); one file at a time, because
      #       gate0-linux.sh and gate0b-linux.sh share the container's LKL build and images
      - name: Run the repo's tests
        env:
          LINUX_HOST_FUSE: 1
        run: sh build/linux-host.sh env MAVERICKS_TEST_JOBS=1 sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # platform: a FUSE mount the container is refused leaves its reason in the host's kernel log (an AppArmor denial,
      #           say), which the container cannot read
      - name: Kernel log, when the tests fail
        if: failure()
        run: sudo dmesg | grep -iE 'apparmor|fuse|denied' | tail -n 60 || true

      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: |
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product "Linux Filesystems" --min-os 10.9.5 --out "$DIST/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$DIST/RELEASE_NOTES.md" --digest "$digest"

      - name: Sign the pkg and write its feed
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product linuxfs --feed-dir "$DIST" \
            --channel-title "Linux Filesystems for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/linuxfs-$VER.pkg" \
            --notes-file "$DIST/RELEASE_NOTES.md" --pkg "$DIST/linuxfs-$VER.pkg" --min-os 10.9.5

      - name: Unsigned stand-in feed (never published)
        if: steps.ver.outputs.release != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$DIST" "${{ steps.ver.outputs.full }}"

      - name: Artifact conformance
        run: |
          set -eu
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$DIST" "${{ steps.ver.outputs.full }}")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade
        if: steps.ver.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$DIST/linuxfs.xml" --version "${{ steps.ver.outputs.full }}"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linuxfs
          if-no-files-found: error
          path: |
            ${{ env.DIST }}/*.pkg
            ${{ env.DIST }}/RELEASE_NOTES.md
            ${{ env.DIST }}/*.xml

  on-mavericks:
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/on-mavericks.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: linuxfs
    secrets:
      MAVERICKS_VM_KEY: ${{ secrets.MAVERICKS_VM_KEY }}

  scan:
    needs: [build]
    if: always() && needs.build.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: linuxfs }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [build, on-mavericks, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.build.outputs.version }}", artifact: linuxfs }

  retry:
    needs: [build, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.build.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [build, on-mavericks, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
